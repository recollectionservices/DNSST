// =============================================================
// Sample BIND 9 recursive resolver on a static public IP
// File location: /etc/bind/named.conf (Debian/Ubuntu)
//                /etc/named.conf      (RHEL/Rocky/Alma)
//
// Placeholders (replace with your own):
//   203.0.113.10    = your server's static public IP
//   198.51.100.0/24 = public range of the clients you serve
//   192.168.1.0/24  = your internal LAN (if applicable)
//
// WARNING: never leave recursion open to the whole internet.
// Open resolvers get abused for DDoS amplification attacks.
// =============================================================

// ---- Who is allowed to use this resolver ----
acl "trusted" {
    127.0.0.1;
    ::1;
    192.168.1.0/24;
    198.51.100.0/24;
};

options {
    directory "/etc/";

    // ---- Listen on the static public IP (UDP and TCP, port 53) ----
    // BIND listens on both UDP and TCP automatically for each address.
    listen-on port 53 { 127.0.0.1; 203.0.113.10; };
    listen-on-v6 { none; };          // change to { any; } if you use IPv6

    // ---- Recursive resolving, restricted to trusted clients ----
    recursion yes;
    allow-query        { trusted; };
    allow-recursion    { trusted; };
    allow-query-cache  { trusted; };

    // ---- Lock down everything else ----
    allow-transfer { none; };        // no zone transfers (AXFR over TCP)
allow-update   { none; };
    version "not disclosed";
    hostname none;
    server-id none;

    // ---- TCP tuning (time values are in 1/10 second) ----
    tcp-listen-queue       10;       // pending TCP connection backlog
    tcp-initial-timeout    300;      // 30s to send first query after connect
    tcp-idle-timeout       300;      // 30s idle before closing
    tcp-keepalive-timeout  300;      // keepalive for EDNS TCP keepalive
    tcp-advertised-timeout 300;

    // ---- Resource limits ----
    recursive-clients 1000;          // max simultaneous recursive lookups
   
    // ---- Secure / Shell/ ----
    dnssec-validation auto;          // validate DNSSEC using built-in trust anchors
    minimal-responses yes;
    forwarders { };                  // empty = resolve from the roots yourself

// ---- Logging ----
logging {
    channel default_log {
        file "/var/log/named/named.log" versions 3 size 10m;
        severity info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category default { default_log; };
    category queries { default_log; };   // remove if too noisy
};
